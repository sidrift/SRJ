  apiVersion: apps/v1
  kind: Deployment

  metadata:
    name: srj-api

  spec:
    replicas: 2

    selector:
      matchLabels:
        app: srj-api

    template:
      metadata:
        labels:
          app: srj-api

      spec:
        containers:
          - name: srj-api

            image: 800591602050.dkr.ecr.ap-south-1.amazonaws.com/srj-api:latest

            ports:
              - containerPort: 8080